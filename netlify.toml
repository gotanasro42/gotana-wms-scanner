# Pri každom nasadení sa z tw-in.css vyrobí hotový súbor so štýlmi tailwind.css
[build]
  publish = "."
  # + číslo verzie (commit) do stránok a do verzia.json – appka podľa neho zistí, že je nová verzia
  command = "npx --yes tailwindcss@3.4.19 -i ./tw-in.css -o ./tailwind.css --minify && V=${COMMIT_REF:-$(date +%s)} && sed -i \"s/__GOTANA_VERZIA__/$V/g\" index.html statistiky.html trhovisko.html && echo \"{\\\"v\\\":\\\"$V\\\"}\" > verzia.json"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/verzia.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/statistiky.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
